name: Fidu
description: >-
  Fidu is an operating system and financial-services platform for private K-12
  schools across Spanish-speaking Latin America. Founded in 2022 and
  headquartered in Buenos Aires, Argentina, Fidu digitizes the academic,
  administrative, financial, and communication processes of educational
  institutions in a single platform. School administrators send tuition
  statements and pay slips to families, who then pay tuition directly through
  the Fidu mobile app, and a "Parent Copilot" AI layer handles 24/7 automated
  responses, content generation, and academic-data synchronization with school
  information systems. Fidu raised a $5M seed round led by NFX and Lightspeed
  Venture Partners and reports more than 1,000 institutions across 10 countries
  and over 500,000 active users. Fidu does not currently publish a public
  developer program, API reference, or OpenAPI definition; this profile captures
  the company's real public web properties only.
